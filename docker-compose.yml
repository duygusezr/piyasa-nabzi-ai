version: "3.9"

services:
  # ── Backend — FastAPI / uvicorn ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: piyasanabzi-backend
    env_file: ./backend/.env
    # PORT 8001 dışarıya açılmıyor — sadece frontend nginx proxy üzerinden erişilir
    expose:
      - "8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Frontend — React + nginx (reverse proxy) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: piyasanabzi-frontend
    ports:
      - "80:80"        # HTTP  → 80
      # - "443:443"    # HTTPS → Let's Encrypt kurulduktan sonra etkinleştir
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: piyasanabzi-net
